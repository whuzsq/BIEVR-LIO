# 重定位不记录建图用的 GNSS/点云归档，保留 Log/gnss/scans.bin。
gnss_recorder:
  enable: False

# 本文件叠加在 params.yaml 之后，启用不加载稠密 PCD、不运行 GICP 的
# “LIO + 支柱地图 + 轨道辅助”定位模式。
map_save:
  accumulate: False
  # 里程计轨迹写到定位目录，避免覆盖建图时的 odometry_tum.txt/trajectory.obj。
  path: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/pole_localization/map.pcd"

loop_closure:
  enable: False

localization:
  enable: False

pole_extraction:
  enable: True
  output_directory: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/poles_localization"
  save_keyframe_clouds: False
  # 重定位仅使用当前 LIO；不加载建图阶段的修正轨迹。
  mapping_trajectory_path: ""

  # 二次运行时加载首次保存的支柱地图，优化 T_map_odom 的 x/y/yaw。
  # 本文件只在支柱地图重定位时加载。
  localization_enable: True
  localization_map_path: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/poles/landmarks.txt"
  localization_map_frame: "map"
  localization_window_keyframes: 7
  localization_match_distance_m: 4.0
  # 回程可能位于邻近股道：在普通 ±10m ROI 外，保留预测先验柱轴附近的点。
  # 仅定位时生效；柱体检测、最少匹配数和验收门限不变。
  localization_guided_roi: True
  localization_guided_roi_radius_m: 5.0
  localization_guided_roi_max_range_m: 40.0
  localization_radius_difference_m: 0.30
  localization_axis_angle_deg: 5.0
  localization_min_matches: 3 # 数学下限；同时要求 60% 匹配率和 10m 基线
  localization_min_match_ratio: 0.60
  localization_min_baseline_m: 10.0
  localization_max_rms_m: 0.50
  localization_huber_delta_m: 0.50
  localization_max_translation_step_m: 5.0
  localization_max_yaw_step_deg: 5.0
  # 正常使用 /initialpose、GNSS 或已知起点提供初值。仅当两次 odom 确定
  # 共原点时才启用下面的手工初值。
  localization_use_initial_guess: False
  localization_initial_translation: [0.0, 0.0, 0.0]
  # 可选完整姿态 [qx,qy,qz,qw]；存在时优先于 yaw。坡道或中途启动时建议填写。
  localization_initial_orientation_xyzw: []
  localization_initial_yaw_deg: 0.0

# 重定位模式显式启用轨道辅助；下列参数仅控制地图匹配。
rail_extraction:
  enable: True
  map_path: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/poles/rail_vector_map.txt"
  match_distance_m: 2.0
  max_tangent_angle_deg: 12.0
  min_matches: 10
  min_baseline_m: 8.0
  huber_delta_m: 0.08
  max_rms_m: 0.12
  # 轨道平面约束只使用横轨方向和 yaw；沿轨平移始终不进入残差。
  max_planar_rms_m: 0.30
  max_cross_track_step_m: 1.0
  max_yaw_step_deg: 2.0
  max_z_step_m: 1.0
  max_tilt_step_deg: 2.0
  # 左右轨顶高差约束横滚，沿线坡度约束俯仰；均不引入沿轨方向平移约束。
  update_roll: True
  update_pitch: True

# 支柱/轨道地图定位输出层；与稠密点云 localization 严格互斥。
pole_localization:
  enable: True
  map_frame: "map"
  output_directory: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/pole_localization"

  # 递推协方差层负责创新门控；通过门控的观测进入下方 GTSAM 因子图。
  # 测量噪声根据匹配 RMS、匹配数量和空间基线自适应调整。
  filter_enable: True
  # GTSAM Pose3 因子图：每个支柱/轨道提取关键帧建立 X(k)，相邻节点由 LIO
  # BetweenFactor 连接；支柱只约束 x/y/yaw，轨道只约束 z/roll/pitch。
  factor_graph_enable: True
  factor_graph_huber_delta: 2.5
  factor_graph_prior_translation_sigma_m: 0.50
  factor_graph_prior_rotation_sigma_deg: 2.0
  process_noise_xy_m_per_sqrt_m: 0.05
  process_noise_yaw_deg_per_sqrt_m: 0.03
  process_noise_z_m_per_sqrt_m: 0.05
  process_noise_tilt_deg_per_sqrt_m: 0.03
  measurement_xy_floor_m: 0.08
  measurement_yaw_floor_deg: 0.05
  # 这里描述跨关键帧重复提取精度，不是单段曲线内部的厘米级拟合残差。
  measurement_z_floor_m: 0.08
  measurement_tilt_floor_deg: 0.10
  mahalanobis_gate: 36.0
  max_innovation_translation_m: 5.0
  # Railway poles are periodic: the bag1--bag3 online replay produced a
  # geometrically tight three-pole alias with a 1.229 deg yaw jump, while the
  # preceding valid filtered updates stayed below 0.201 deg.
  max_innovation_yaw_deg: 0.5
  # 该数据中非刚性的 map<-odom 高程修正相邻关键帧可变化约 2~5m；候选进入
  # 此处前已经通过轨距、切向、基线和竖直 RMS 检验，因此使用独立的宽门限。
  max_innovation_z_m: 5.0
  max_innovation_tilt_deg: 2.0
  rail_mahalanobis_gate: 144.0
  # 超过该里程没有通过轨道约束时，下一次高质量轨道拟合重新初始化
  # z/roll/pitch，避免长无轨区后的累计高程差被小创新门限永久拒绝。
  rail_rebootstrap_gap_m: 100.0

  # 首次和丢失恢复都要求连续多个窗口确认；长距离没有新支柱时仅改变状态，
  # 仍保留最后修正并由 LIO 连续推算，不向 LIO 前端反馈跳变。
  initial_confirmations: 2
  recovery_confirmations: 2
  degraded_after_distance_m: 90.0
  lost_after_distance_m: 240.0

  publish_path: True
  path_publish_frequency: 2.0
  path_max_poses: 0
  prelocalization_buffer_frames: 5000 # 离线快速回放时按确认时间戳回填轨迹
